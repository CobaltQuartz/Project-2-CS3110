<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music Store Analytics Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    body { background-color: #f8f9fa; }
    .chartCard {
      background-color: #ffffff;
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    h1 {
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row">
      <div class="col-12 text-center">
        <h1>Music Store Analytics Dashboard</h1>
        <p class="text-muted">
          Project 2 – Five data sources, five charts, Bootstrap grid, CSV data getter
        </p>
      </div>
    </div>

    <div class="row">
      <div class="col-md-8 col-12">
        <div class="chartCard">
          <h5>Daily Total Sales</h5>
          <canvas id="chartDailySales"></canvas>
        </div>
      </div>
      <div class="col-md-4 col-12">
        <div class="chartCard">
          <h5>Sales by Payment Method</h5>
          <canvas id="chartPayment"></canvas>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 col-12">
        <div class="chartCard">
          <h5>Units Sold by Instrument Category</h5>
          <canvas id="chartCategory"></canvas>
        </div>
      </div>
      <div class="col-md-6 col-12">
        <div class="chartCard">
          <h5>Average Sale per Transaction by Region</h5>
          <canvas id="chartRegion"></canvas>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-12">
        <div class="chartCard">
          <h5>Total Sales by Membership Level</h5>
          <canvas id="chartMembership"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function loadCsvToArrays(csvPath) {
      const response = await fetch(csvPath);
      const text = await response.text();
      const lines = text.trim().split("\n");
      const labels = [];
      const values = [];

      for (let i = 1; i < lines.length; i++) {
        const parts = lines[i].split(",");
        labels.push(parts[0]);
        values.push(parseFloat(parts[1]));
      }
      return { labels, values };
    }

    async function buildCharts() {
      const daily = await loadCsvToArrays("daily_sales.csv");
      new Chart(document.getElementById("chartDailySales"), {
        type: "line",
        data: {
          labels: daily.labels,
          datasets: [{
            label: "Total Sales ($)",
            data: daily.values,
            fill: false,
            tension: 0.2
          }]
        },
        options: { responsive: true, scales: { y: { beginAtZero: true } } }
      });

      const pay = await loadCsvToArrays("payment_sales.csv");
      new Chart(document.getElementById("chartPayment"), {
        type: "pie",
        data: { labels: pay.labels, datasets: [{ data: pay.values }] },
        options: { responsive: true }
      });

      const cat = await loadCsvToArrays("category_units.csv");
      new Chart(document.getElementById("chartCategory"), {
        type: "bar",
        data: {
          labels: cat.labels,
          datasets: [{ label: "Units Sold", data: cat.values }]
        },
        options: { responsive: true, scales: { y: { beginAtZero: true } } }
      });

      const region = await loadCsvToArrays("region_avg.csv");
      new Chart(document.getElementById("chartRegion"), {
        type: "radar",
        data: {
          labels: region.labels,
          datasets: [{ label: "Average Sale ($)", data: region.values }]
        },
        options: { responsive: true }
      });

      const member = await loadCsvToArrays("membership_sales.csv");
      new Chart(document.getElementById("chartMembership"), {
        type: "polarArea",
        data: { labels: member.labels, datasets: [{ data: member.values }] },
        options: { responsive: true }
      });
    }

    buildCharts();
  </script>
</body>
</html>
